version: '3.8'

services:
  # DML Micro App Service
  dml-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: {{DEPLOYMENT_NAME}}
    ports:
      - "3001:3001"  # Backend API
      - "5173:5173"  # Frontend (if running dev server in container)
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Add your API keys and environment variables here
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      # Persist session workspaces
      - workspace-data:/app/server/workspaces
      # Optional: Mount local DML file for development
      # - ./src/dml:/app/src/dml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dml-network

  # Optional: Nginx reverse proxy for serving frontend + API
  nginx:
    image: nginx:alpine
    container_name: {{DEPLOYMENT_NAME}}-nginx
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dml-app
    restart: unless-stopped
    networks:
      - dml-network

volumes:
  workspace-data:
    driver: local

networks:
  dml-network:
    driver: bridge
