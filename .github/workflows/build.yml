name: Build/release

on: push

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v1
        with:
          node-version: 22

      - name: Download VM image (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p vendor/v86/images
          curl -fsSL -o vendor/v86/images/alpine.img "https://s3.us-west-2.wasabisys.com/deepclause-public/alpine.img?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=U0K278CH7E009DE52ZN8%2F20251120%2Fus-west-2%2Fs3%2Faws4_request&X-Amz-Date=20251120T035146Z&X-Amz-Expires=43200&X-Amz-Signature=21969a383c6952dbc69eeed9097d8824e07d722a5a7123943afc4c2b954715cf&X-Amz-SignedHeaders=host&x-id=GetObject"
        shell: bash

      - name: Download VM image (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path vendor\v86\images | Out-Null
          Invoke-WebRequest -Uri "https://s3.us-west-2.wasabisys.com/deepclause-public/alpine.img?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=U0K278CH7E009DE52ZN8%2F20251120%2Fus-west-2%2Fs3%2Faws4_request&X-Amz-Date=20251120T035146Z&X-Amz-Expires=43200&X-Amz-Signature=21969a383c6952dbc69eeed9097d8824e07d722a5a7123943afc4c2b954715cf&X-Amz-SignedHeaders=host&x-id=GetObject" -OutFile vendor\v86\images\alpine.img
        shell: pwsh
        
      - name: Build/release Electron app
        uses: samuelmeuli/action-electron-builder@v1
        with:
          # GitHub token, automatically provided to the action
          # (No need to define this secret in the repo settings)
          github_token: ${{ secrets.github_token }}

          # If the commit is tagged with a version (e.g. "v1.0.0"),
          # release the app after building
          release: true
